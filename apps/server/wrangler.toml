name = "ludo-arena-server"
main = "src/index.ts"
compatibility_date = "2024-06-14"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]

[[d1_databases]]
binding     = "DB"
database_name = "ludo-arena-db"
database_id   = "e0775307-dd1f-44f4-bb11-bc60d3f45b05"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173"
