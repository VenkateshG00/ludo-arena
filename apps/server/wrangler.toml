name = "ludo-arena-server"
main = "src/index.ts"
compatibility_date = "2024-06-14"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://ludo-arena-ad5.pages.dev"

# Set these as secrets (never commit real values):
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_SERVICE_KEY
